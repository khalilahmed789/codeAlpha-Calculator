<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Calculator</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="calculator">
        <input type="text" id="display" readonly/>
      <div class="buttons">
        <button class="clear" onclick="eraseAll()">AC</button>
        <button class="delete" id="erase" onclick="deleteLast();">DEL</button>
        <button class="operators" onclick="percentage()">%</button>
        <button class="operators" onclick="writeValue('/')">÷</button>
        <button onclick="writeValue('7')">7</button>
        <button onclick="writeValue('8')">8</button>
        <button onclick="writeValue('9')">9</button>
        <button class="operators" onclick="writeValue('*')">x</button>
        <button onclick="writeValue('4')">4</button>
        <button onclick="writeValue('5')">5</button>
        <button onclick="writeValue('6')">6</button>
        <button class="operators" onclick="writeValue('+')">+</button>
        <button onclick="writeValue('1')">1</button>
        <button onclick="writeValue('2')">2</button>
        <button onclick="writeValue('3')">3</button>
        <button class="operators" onclick="writeValue('-')">-</button>
        <button class="zero" onclick="writeValue('0')">0</button>
        <button onclick="writeValue('.')">.</button>
        <button class="equal" onclick="calculate()">=</button>
      </div>
    </div>
  </body>
  <script src="script.js"></script>
</html>
